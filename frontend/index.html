<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ShortForge</title>
<style>
  :root { --bg:#0f1115; --card:#181b22; --line:#2a2f3a; --text:#e8eaf0; --mute:#8b93a7; --accent:#4f8cff; }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font-family:system-ui,Segoe UI,sans-serif; }
  main { max-width:1040px; margin:0 auto; padding:24px; display:grid; gap:20px; grid-template-columns:1fr 320px; }
  @media (max-width:820px){ main{grid-template-columns:1fr;} }
  h1 { grid-column:1/-1; margin:0; font-size:1.5rem; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; }
  textarea { width:100%; height:130px; background:var(--bg); color:var(--text); border:1px solid var(--line);
             border-radius:8px; padding:10px; font:inherit; resize:vertical; }
  label { display:block; font-size:.8rem; color:var(--mute); margin:12px 0 4px; }
  select, input[type=text], input[type=number] { width:100%; background:var(--bg); color:var(--text);
        border:1px solid var(--line); border-radius:8px; padding:8px; font:inherit; }
  .row { display:grid; grid-template-columns:1fr 1fr; gap:10px; }
  .check { display:flex; gap:8px; align-items:center; margin-top:14px; font-size:.9rem; }
  button { background:var(--accent); color:#fff; border:0; border-radius:8px; padding:12px; font:inherit;
           font-weight:600; cursor:pointer; width:100%; margin-top:16px; }
  button:disabled { opacity:.5; cursor:wait; }
  .hint { color:var(--mute); font-size:.8rem; margin-top:6px; }
  .bar { height:10px; background:var(--bg); border-radius:6px; overflow:hidden; margin:10px 0 6px; }
  .bar > div { height:100%; width:0; background:var(--accent); transition:width .5s; }
  video { width:100%; max-height:560px; background:#000; border-radius:8px; }
  a.dl { display:inline-block; margin-top:10px; color:var(--accent); text-decoration:none; font-weight:600; }
  .item { padding:10px 0; border-top:1px solid var(--line); cursor:pointer; font-size:.85rem; }
  .item:first-child { border-top:0; }
  .item small { color:var(--mute); display:block; }
  .err { color:#ff6b6b; }
</style>
</head>
<body>
<main>
  <h1>ShortForge</h1>

  <section>
    <div class="card">
      <label style="margin-top:0">Scene prompts</label>
      <textarea id="text" placeholder="One line = a subject (auto camera shots).&#10;Several lines = one scene per line."></textarea>

      <label>Narration (optional, one line per scene, same order)</label>
      <textarea id="narration" placeholder="Short sentences, about 8 to 14 words each."></textarea>

      <label>Avoid (optional)</label>
      <input type="text" id="avoid" placeholder="e.g. person, girl, woman, human, text">

      <div class="row">
        <div><label>Scenes (one-line mode)</label>
          <input id="scenes" type="number" min="1" max="30" value="4"></div>
        <div><label>Narrator voice</label>
          <select id="voice"><option value="female">Female (Zira)</option>
            <option value="male">Male (David)</option></select></div>
      </div>
      <div class="row">
        <div><label>Slow-down</label>
          <select id="slow"><option value="1">1x (2 s/scene)</option>
            <option value="1.5" selected>1.5x (3 s/scene)</option>
            <option value="2">2x (4 s/scene)</option></select></div>
        <div><label>Cool-down between scenes</label>
          <select id="cooldown"><option value="0">None</option>
            <option value="30" selected>30 s</option>
            <option value="60">60 s</option></select></div>
      </div>
      <div class="row">
        <div><label>Generation size</label>
          <select id="size"><option value="384x672" selected>384 x 672 (faster)</option>
            <option value="480x832">480 x 832 (sharper, hotter)</option>
            <option value="320x576">320 x 576 (fastest, coolest)</option></select></div>
        <div><label>Frames per scene</label>
          <select id="length"><option value="17">17 (~1 s)</option>
            <option value="33" selected>33 (~2 s)</option></select></div>
      </div>
      <div class="check"><input type="checkbox" id="captions" checked> <span>Burn subtitles into the video</span></div>
      <button id="go">Generate video</button>
      <div class="hint" id="eta"></div>
    </div>

    <div class="card" style="margin-top:20px" id="status" hidden>
      <div id="msg"></div>
      <div class="bar"><div id="fill"></div></div>
      <div class="hint" id="time"></div>
    </div>

    <div class="card" style="margin-top:20px" id="player" hidden>
      <video id="vid" controls loop></video>
      <a class="dl" id="dl" download>Download MP4</a>
    </div>
  </section>

  <aside class="card">
    <strong>History</strong>
    <div id="hist"></div>
  </aside>
</main>

<script>
const $ = id => document.getElementById(id);
let current = null, timer = null;
const SEC = { "320x576|17":75, "384x672|17":70, "384x672|33":160, "480x832|17":160, "480x832|33":400, "320x576|33":120 };

function sceneCount() {
  const lines = $("text").value.split("\n").filter(l => l.trim());
  return lines.length > 1 ? lines.length : (+$("scenes").value || 1);
}
function updateEta() {
  const per = SEC[$("size").value + "|" + $("length").value] || 160;
  const n = sceneCount();
  const total = n * (per + +$("cooldown").value) + 60;
  $("eta").textContent = `${n} scene(s), about ${Math.round(total / 60)} min including cool-down and assembly.`;
}
["text","scenes","size","length","cooldown"].forEach(i => $(i).addEventListener("input", updateEta));
updateEta();

$("go").onclick = async () => {
  const [w, h] = $("size").value.split("x").map(Number);
  const r = await fetch("/api/generate", { method:"POST", headers:{ "Content-Type":"application/json" },
    body: JSON.stringify({ text:$("text").value, narration:$("narration").value, avoid:$("avoid").value,
      scenes:+$("scenes").value, width:w, height:h, length:+$("length").value, slow:+$("slow").value,
      voice:$("voice").value, captions:$("captions").checked, cooldown:+$("cooldown").value }) });
  if (!r.ok) { alert((await r.json()).detail || "Error"); return; }
  current = (await r.json()).id;
  $("player").hidden = true; $("status").hidden = false; $("go").disabled = true;
  poll(); timer = setInterval(poll, 3000);
};

async function poll() {
  const j = await (await fetch("/api/jobs/" + current)).json();
  const pct = j.status === "done" ? 100 : Math.min(95, Math.round(j.done / j.total * 100));
  $("fill").style.width = pct + "%";
  const m = $("msg");
  if (j.status === "error") { m.className = "err"; m.textContent = "Failed: " + j.message; }
  else { m.className = ""; m.textContent = `${j.message} (${pct}%)`; }
  if (j.started && j.status === "running")
    $("time").textContent = "Elapsed: " + Math.round(Date.now()/1000 - j.started) + " s";
  if (j.status === "done" || j.status === "error") {
    clearInterval(timer); $("go").disabled = false;
    if (j.video) show(j);
    loadHistory();
  }
}

function show(j) {
  $("player").hidden = false;
  $("vid").src = j.video; $("dl").href = j.video;
  $("dl").setAttribute("download", j.id + ".mp4");
}

async function loadHistory() {
  const list = await (await fetch("/api/history")).json();
  $("hist").innerHTML = "";
  list.forEach(j => {
    const d = document.createElement("div"); d.className = "item";
    d.textContent = (j.prompts[0] || "").slice(0, 45) + "...";
    const s = document.createElement("small");
    s.textContent = new Date(j.created * 1000).toLocaleString() + " - " + j.status;
    d.appendChild(s);
    if (j.video) d.onclick = () => { $("status").hidden = true; show(j); };
    $("hist").appendChild(d);
  });
}
loadHistory();
</script>
</body>
</html>
